# Trust CF-Connecting-IP only when the direct connection comes from Cloudflare.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

upstream peoplegraph_frontend {
    server frontend:3000;
}

upstream peoplegraph_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name peoplegraph.co www.peoplegraph.co;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name peoplegraph.co www.peoplegraph.co;

    ssl_certificate /etc/letsencrypt/live/peoplegraph.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peoplegraph.co/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PeopleGraphSSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    location /api/ {
        proxy_pass http://peoplegraph_backend;
    }

    location /django-static/ {
        proxy_pass http://peoplegraph_backend;
    }

    location / {
        proxy_pass http://peoplegraph_frontend;
    }
location = /admin {
    return 301 /admin/;
}

location /admin/ {
    proxy_pass http://peoplegraph_backend;
}
}
